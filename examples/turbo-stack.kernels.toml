# groundline kernel manifest — the NCAR / turbo-stack production instance.
#
# This file is the *site config* for the MOM6 ⇄ TIM kernel bank: every
# machine-specific path (the /glade dump directory, the AMReX install, the
# MPI headers) lives HERE, not in groundline code — the package itself has no
# built-in defaults. On another site, copy this file and repoint the paths.
#
# How to read it: [fortran] and [cpp] configure each language side once —
# where its inputs live, which compiler reads them, and which Lean module
# `groundline kernel generate` writes. Each [[kernel]] then gives one
# kernel's location on each side.
#
# Use it via any of (resolution order):
#   groundline kernel list --kernels examples/turbo-stack.kernels.toml
#   export GROUNDLINE_KERNELS=$PWD/examples/turbo-stack.kernels.toml
#   cp examples/turbo-stack.kernels.toml ./kernels.toml
#
# String values support ${ENV_VAR} expansion; relative paths resolve against
# this file's directory. Schema reference: groundline/kernel_bank.py.

[fortran]
# Directory of flang parse-tree dumps (with sema) from the MOM6 production build.
dumps = "/glade/work/altuntas/turbo-stack/bin/flang_ptree/MOM6_using_FMS2"
generated = "../lean/groundline/Groundline/GeneratedFtn.lean"
namespace = "Groundline.GeneratedFtn"
blurb = """Fidelity against the hand-written reference models is machine-checked in
`Groundline/FidelityFtn.lean`."""

[cpp]
# The TIM kernel headers, and the pinned clang invocation that reads them
# (clang 21 via activate_llvm.sh; the include dirs are part of the kernel
# identity — a different toolchain is a different AST).
sources = "/glade/work/altuntas/turbo-stack/submodules/infra/TIM/mom/cpp"
include_dirs = [
  # AMReX install (AMReX_REAL.H etc.)
  "/glade/work/altuntas/turbo-stack/bin/gnu/MOM6_using_TIM/amrex/install/include",
  # the TIM kernel headers themselves
  "/glade/work/altuntas/turbo-stack/submodules/infra/TIM/mom/cpp",
  # mpi.h for AMReX's #include <mpi.h>
  "/glade/work/altuntas/llvm-hpc/include",
]
compiler = "clang++"
# Files display relative to this root in the generated provenance comments.
provenance_root = "/glade/work/altuntas/turbo-stack"
generated = "../lean/groundline/Groundline/GeneratedCpp.lean"
namespace = "Groundline.GeneratedCpp"
blurb = """Fidelity against the hand-written reference models is machine-checked in
`Groundline/FidelityCpp.lean`."""

[lean]
# `groundline kernel verify` re-checks every theorem here (when lake is on PATH).
project = "../lean/groundline"

# --- The banked pairs (5 of 5 TIM point kernels; DEVLOG 2026-07-31) ---------
#
# Every Fortran kernel in this group is a loop nest in the source, compared
# against a per-point C++ function — `pointize = true` licenses reducing each
# loop to its per-point body (see the manual's Pointize page for the two
# iteration licenses that justify it).

[[kernel]]
name = "ppm_limit_pos"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "ppm_limit_pos" }
cpp = { source = "mom_continuity_ppm_kernel.hpp", function = "ppm_limit_pos_point" }
pointize = true

[[kernel]]
name = "ppm_limit_cw84"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "ppm_limit_cw84" }
cpp = { source = "mom_continuity_ppm_kernel.hpp", function = "ppm_limit_cw84_point" }
pointize = true

[[kernel]]
# zonal_edge_thickness nest 1 = the do concurrent under CS%upwind_1st.
name = "edge_thickness_upwind"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "zonal_edge_thickness", nest = 1 }
cpp = { source = "mom_continuity_ppm_kernel.hpp", function = "edge_thickness_upwind_point" }
pointize = true

# thickness_to_dz_3d nests, in source order: 1 = do-concurrent non-Boussinesq,
# 2 = plain-DO non-Boussinesq, 3 = do-concurrent Boussinesq, 4 = plain-DO
# Boussinesq. The plain-DO variants (the default execution path;
# do_offload=.false.) are the banked ones — rule A's schema lemma is their
# license.

[[kernel]]
name = "thickness_to_dz_3d_boussinesq"
fortran = { dump = "MOM6/MOM_interface_heights.o_ptree", subroutine = "thickness_to_dz_3d", nest = 4 }
cpp = { source = "mom_interface_heights_kernel.hpp", function = "thickness_to_dz_3d_boussinesq_point" }
pointize = true

[[kernel]]
name = "thickness_to_dz_3d_nonboussinesq"
fortran = { dump = "MOM6/MOM_interface_heights.o_ptree", subroutine = "thickness_to_dz_3d", nest = 2 }
cpp = { source = "mom_interface_heights_kernel.hpp", function = "thickness_to_dz_3d_nonboussinesq_point" }
pointize = true

[[kernel]]
name = "ratio_max"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "ratio_max" }
cpp = { source = "mom_continuity_ppm_kernel.hpp", function = "ratio_max_point" }

[[kernel]]
# The PPM face flux and its velocity derivative — the physics of the whole
# mass-flux family. An ELEMENTAL subroutine (per-point as written); its
# logical dummy vol_CFL is a Bool input, and the grid structs G/GV/US, which
# the body never references, are dropped.
name = "flux_elem"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "flux_elem" }
cpp = { source = "mom_continuity_ppm_kernel.hpp", function = "flux_elem_point" }

# The convergence update — four Fortran nests, one C++ primitive. Each nest is
# the do concurrent body `h = max(h_prev - dt*IareaT*(flux_out - flux_in), h_min)`
# with flux_in read at a neighbor (uh(I-1,j,k) or vh(i,J-1,k): rule C, a
# read-only stencil), G%IareaT(i,j) indexed by two of the three loop indices
# (rule B, subset), and h_min set before the loop (rule D). The C++ port does
# the stencil at the call site and passes scalars, so all four nests pair with
# `continuity_convergence_point`; the C++ side is declared once (a def is
# emitted per entry) and the proofs relate each Fortran def to it.

[[kernel]]
# continuity_zonal_convergence nest 1 = the `present(hin)` branch (h_prev = hin).
name = "continuity_convergence_zonal"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "continuity_zonal_convergence", nest = 1 }
cpp = { source = "mom_continuity_ppm_kernel.hpp", function = "continuity_convergence_point" }
pointize = true

[[kernel]]
# nest 2 = the in-place branch (h_prev = h itself; marked "untested" in the source).
name = "continuity_convergence_zonal_inplace"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "continuity_zonal_convergence", nest = 2 }
pointize = true

[[kernel]]
# continuity_merdional_convergence (sic — the source's spelling) nest 1.
name = "continuity_convergence_meridional"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "continuity_merdional_convergence", nest = 1 }
pointize = true

[[kernel]]
name = "continuity_convergence_meridional_inplace"
fortran = { dump = "MOM6/MOM_continuity_PPM.o_ptree", subroutine = "continuity_merdional_convergence", nest = 2 }
pointize = true
